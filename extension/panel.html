<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc for Chrome</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header><div class="brand"><span class="mark">A</span><div>Arc for Chrome<small>A little more breathing room.</small></div></div></header>
<main>
<form id="search-form" role="search"><label class="sr-only" for="search">Search tabs or enter a URL</label><input id="search" type="search" placeholder="Search or enter a URL…" autocomplete="off"><kbd>↵</kbd></form>
<div class="space-heading"><label for="space">YOUR SPACE</label><button id="add-space" title="Create a space" aria-label="Create a space">+</button></div>
<select id="space" aria-label="Current space"><option value="-1">Inbox</option></select>
<form id="space-form" hidden><label for="space-name">Name your new space</label><div class="inline"><input id="space-name" maxlength="80" placeholder="Work, Life, Inspiration…" required><button type="submit">Create</button><button id="cancel-space" type="button" aria-label="Cancel">×</button></div><small>Creates a Chrome group with a new tab.</small></form>
<section aria-labelledby="favorites-heading"><h2 id="favorites-heading">Favorites</h2><div id="favorites" class="tab-list"></div></section>
<div class="section-heading"><h2 id="tabs-heading">Today</h2><button id="new-tab">+ New tab</button></div>
<section aria-labelledby="tabs-heading"><div id="tabs" class="tab-list"></div></section>
<p id="status" role="status" aria-live="polite"></p>
</main>
<details class="shortcuts"><summary>Keyboard shortcuts</summary><ul id="shortcut-list"></ul><p>In this panel: ⌘/Ctrl+K search · ↑/↓ results · Enter activate · Alt+←/→ spaces · Esc reset.</p><button id="shortcut-settings">Customize shortcuts</button></details>
<footer><span>Make room for what matters.</span><button id="theme" aria-label="Toggle color theme" title="Toggle color theme">◐</button></footer>
<template id="tab-template"><div class="tab"><button class="activate"><span class="favicon" aria-hidden="true"></span><span class="title"></span><span class="audio" aria-hidden="true"></span></button><button class="pin" aria-label="Pin tab">☆</button><button class="close" aria-label="Close tab">×</button></div></template>
<script type="module" src="panel.js"></script>
</body></html>
